name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The app targets the system Python on macOS, so hold the floor at 3.9.
          python-version: "3.9"

      - name: Seed the database
        run: python3 seed.py

      - name: Start the server
        run: |
          python3 server.py --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/config >/dev/null && exit 0
            sleep 0.5
          done
          echo "server did not come up" >&2
          exit 1

      - name: Run the end-to-end suite
        run: python3 tests.py 8000

      - name: Run the carrier credit suite
        run: python3 tests_credit.py 8000

      - name: Run the onboarding and KYC suite
        run: python3 tests_kyc.py 8000

      - name: Run the agreements and network suite
        run: python3 tests_agreements.py 8000

      - name: Check the generated fleet artwork is current
        run: |
          python3 brand/fleet.py
          if ! git diff --quiet; then
            echo "Fleet SVGs are stale. Run 'python3 brand/fleet.py' and commit." >&2
            git diff --stat >&2
            exit 1
          fi

      - name: Check the asset stamps are current
        run: |
          python3 stamp.py
          if ! git diff --quiet; then
            echo "Asset URLs are stale. Run 'python3 stamp.py' and commit." >&2
            git diff --stat >&2
            exit 1
          fi
