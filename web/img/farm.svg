<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A superlink loading fertiliser at a farm block store">
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#828282"/><stop offset="1" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#fsky)"/>
  <circle cx="1310" cy="168" r="58" fill="#f0f0f0" opacity=".42"/>

  <!-- tree line -->
  <path d="M0 396 q40 -40 80 -4 q46 -50 96 -2 q52 -44 104 -2 q44 -36 86 2 q50 -46 100 0 q40 -30 78 4 l0 40 l-544 0Z" fill="#8e8e8e"/>
  <path d="M1120 400 q46 -44 92 -4 q50 -46 100 -2 q44 -34 86 4 q46 -40 92 0 l0 38 l-370 0Z" fill="#8e8e8e"/>

  <!-- silos -->
  <g fill="#7a7a7a">
    <rect x="600" y="196" width="126" height="238" rx="4"/>
    <path d="M600 196 l63 -56 l63 56Z"/>
    <rect x="748" y="238" width="106" height="196" rx="4"/>
    <path d="M748 238 l53 -46 l53 46Z"/>
  </g>
  <!-- store shed with a roller door -->
  <g fill="#6e6e6e">
    <path d="M880 434 l0 -108 l280 0 l0 108Z"/>
    <path d="M866 328 l154 -54 l154 54Z" fill="#f0f0f0"/>
    <rect x="960" y="352" width="120" height="82" fill="#b0b0b0"/>
    <g stroke="#6e6e6e" stroke-width="3">
      <path d="M960 370 H1080"/><path d="M960 390 H1080"/><path d="M960 410 H1080"/>
    </g>
  </g>

  <!-- ground -->
  <rect y="434" width="1600" height="266" fill="#9e9e9e"/>
  <path d="M0 434 h1600 v18 H0Z" fill="#c2c2c2" opacity=".5"/>

  <!-- superlink: horse plus two linked trailers of bagged fertiliser -->
  <g fill="#000">
    <path d="M150 528 h136 v-64 h54 l38 56 v70 h-228Z"/>
    <path d="M302 480 h30 l26 42 h-56Z" fill="#3f3f3f"/>
    <!-- lead trailer -->
    <rect x="386" y="452" width="330" height="86" rx="5"/>
    <path d="M386 452 h330 v-22 h-330Z" fill="#262626"/>
    <!-- link -->
    <rect x="716" y="516" width="34" height="12"/>
    <!-- second trailer -->
    <rect x="750" y="452" width="300" height="86" rx="5"/>
    <path d="M750 452 h300 v-22 h-300Z" fill="#262626"/>
    <rect x="150" y="592" width="900" height="14"/>
    <circle cx="228" cy="606" r="34"/><circle cx="228" cy="606" r="13" fill="#4a4a4a"/>
    <circle cx="500" cy="606" r="34"/><circle cx="500" cy="606" r="13" fill="#4a4a4a"/>
    <circle cx="580" cy="606" r="34"/><circle cx="580" cy="606" r="13" fill="#4a4a4a"/>
    <circle cx="856" cy="606" r="34"/><circle cx="856" cy="606" r="13" fill="#4a4a4a"/>
    <circle cx="936" cy="606" r="34"/><circle cx="936" cy="606" r="13" fill="#4a4a4a"/>
  </g>

  <!-- telehandler stacking bags -->
  <g fill="#0a0a0a" opacity=".95">
    <rect x="1210" y="520" width="130" height="46" rx="8"/>
    <rect x="1236" y="486" width="58" height="38" rx="5"/>
    <path d="M1330 512 L1452 452 L1462 470 L1340 530Z"/>
    <rect x="1440" y="446" width="14" height="70"/>
    <rect x="1440" y="508" width="66" height="12"/>
    <circle cx="1244" cy="572" r="22"/><circle cx="1320" cy="572" r="22"/>
  </g>
  <g fill="#000">
    <rect x="1450" y="470" width="70" height="20" rx="3"/>
    <rect x="1450" y="446" width="70" height="20" rx="3"/>
  </g>
</svg>
