<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Flat deck, tarped hauling on a Zambian corridor"><title>Musanga - Flat deck, tarped on the corridor</title><style>
  :root, svg { --sky:#ffffff; --ridge:#e6e6e6; --hill:#cccccc; --far-mass:#9a9a9a;
    --ground:#f2f2f2; --road:#404040; --kerb:#9a9a9a; --body:#0a0a0a;
    --body-alt:#262626; --glass:#9a9a9a; --tyre:#161616; --hub:#f2f2f2; }

  @media (prefers-color-scheme: dark) {
    :root, svg { --sky:#0a0a0a; --ridge:#161616; --hill:#262626; --far-mass:#404040;
      --ground:#161616; --road:#6e6e6e; --kerb:#404040; --body:#f2f2f2;
      --body-alt:#cccccc; --glass:#6e6e6e; --tyre:#e6e6e6; --hub:#262626; }
  }

  /* The world moves, the truck holds station. A tiling layer slides exactly
     one tile width and snaps back - at linear speed, because any easing on a
     seamless loop reads as the ground stuttering. The easing the brief asks
     for lives where it belongs: on the suspension. */
  .layer { animation: pan var(--speed) linear infinite; }
  @keyframes pan { to { transform: translateX(-640px); } }
  .wheel { animation: roll 1.15s linear infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes roll { to { transform: rotate(360deg); } }
  #bodywork { animation: suspension 2.6s ease-in-out infinite; }
  @keyframes suspension {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(1.1px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .layer, .wheel, #bodywork { animation: none; }
  }
