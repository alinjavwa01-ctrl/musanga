<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Musanga, ten years">
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <!-- anniversary ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="6"/>
  <!-- the M -->
  <text x="256" y="300" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
        font-size="248" letter-spacing="-14" fill="#ffffff">M</text>
  <!-- 10 years lockup -->
  <g transform="translate(256 372)">
    <line x1="-124" y1="-9" x2="-80" y2="-9" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
    <line x1="80" y1="-9" x2="124" y2="-9" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
    <text x="0" y="12" text-anchor="middle"
          font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
          font-size="30" letter-spacing="4" fill="#ffffff">10 YRS</text>
  </g>
</svg>
