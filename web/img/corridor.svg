<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A convoy of haul trucks on an open corridor">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e7e7e"/><stop offset="1" stop-color="#dcdcdc"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b4"/><stop offset="1" stop-color="#8e8e8e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7a7a"/><stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)"/>
  <circle cx="1210" cy="196" r="66" fill="#f0f0f0" opacity=".5"/>

  <!-- far escarpment -->
  <path d="M0 372 L150 330 L300 356 L470 300 L640 344 L820 306 L1010 350 L1200 316 L1390 352 L1600 322 L1600 430 L0 430Z" fill="url(#haze)" opacity=".55"/>
  <!-- near ridge -->
  <path d="M0 412 L210 386 L400 408 L610 378 L830 406 L1060 380 L1290 406 L1600 384 L1600 470 L0 470Z" fill="#7c7c7c"/>

  <!-- ground -->
  <rect y="452" width="1600" height="248" fill="#9a9a9a"/>
  <!-- road surface, tapering to the horizon -->
  <path d="M690 452 L910 452 L1600 700 L120 700Z" fill="url(#road)"/>
  <!-- centre line -->
  <g fill="#d8d8d8" opacity=".85">
    <path d="M793 456 l14 0 l3 20 l-20 0Z"/>
    <path d="M786 500 l28 0 l6 34 l-40 0Z"/>
    <path d="M774 560 l52 0 l11 52 l-74 0Z"/>
    <path d="M755 640 l90 0 l18 60 l-126 0Z"/>
  </g>
  <!-- verge scrub -->
  <g fill="#5e5e5e">
    <path d="M0 470 q60 -22 120 0 q70 -26 140 4 l0 30 l-260 0Z"/>
    <path d="M1340 470 q70 -24 140 0 q60 -20 120 2 l0 28 l-260 0Z"/>
  </g>

  <!-- lead truck: horse plus tipper trailer, drawn as one confident silhouette -->
  <g fill="#000">
    <path d="M300 600 h150 v-70 h58 l40 62 v78 h-248Z"/>
    <path d="M470 548 h34 l30 46 h-64Z" fill="#3a3a3a"/>
    <rect x="516" y="512" width="330" height="96" rx="6"/>
    <path d="M516 512 l0 -34 l330 0 l0 34Z" fill="#1f1f1f"/>
    <rect x="300" y="662" width="546" height="14"/>
    <circle cx="380" cy="676" r="34"/><circle cx="380" cy="676" r="13" fill="#4a4a4a"/>
    <circle cx="606" cy="676" r="34"/><circle cx="606" cy="676" r="13" fill="#4a4a4a"/>
    <circle cx="686" cy="676" r="34"/><circle cx="686" cy="676" r="13" fill="#4a4a4a"/>
    <circle cx="790" cy="676" r="34"/><circle cx="790" cy="676" r="13" fill="#4a4a4a"/>
  </g>

  <!-- second unit, further back and lighter for depth -->
  <g fill="#1a1a1a" opacity=".92">
    <path d="M900 596 h96 v-44 h38 l26 40 v50 h-160Z"/>
    <rect x="1044" y="566" width="214" height="62" rx="4"/>
    <rect x="900" y="638" width="358" height="10"/>
    <circle cx="952" cy="650" r="22"/><circle cx="1096" cy="650" r="22"/><circle cx="1148" cy="650" r="22"/>
  </g>

  <!-- third, a smudge on the horizon -->
  <g fill="#2c2c2c" opacity=".75">
    <path d="M1300 570 h56 v-26 h22 l16 24 v30 h-94Z"/>
    <rect x="1386" y="552" width="126" height="38" rx="3"/>
    <circle cx="1330" cy="602" r="13"/><circle cx="1424" cy="602" r="13"/><circle cx="1464" cy="602" r="13"/>
  </g>
</svg>
